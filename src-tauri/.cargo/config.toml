# 16 KB page alignment for Android (docs/ANDROID.md §11).
#
# Android 15 introduced devices with a 16 KB memory page size, and Android 16
# actively flags apps that aren't ready for it: launching a 4 KB-aligned build
# on a Pixel running Android 16 raises `AppWarnings: Showing
# PageSizeMismatchDialog`, and on a device *in* 16 KB mode the `.so` fails to
# load outright.
#
# NDK 27's linker still defaults to 4 KB (`max-page-size=0x1000`); r28 changed
# the default, so this flag becomes redundant — harmless, but removable — once
# the NDK pin moves. Verify with:
#
#   llvm-readelf -l libkitty_lib.so | awk '/LOAD/{getline; print $NF}'
#
# which must print 0x4000, not 0x1000.
#
# `-C strip=symbols` (all four targets below): a `pnpm tauri android build
# --debug` uses cargo's `dev` profile, which embeds full DWARF debug info
# directly in the ELF `.so` — unlike Windows, where debug info lives in a
# separate `.pdb` and the binary itself stays small regardless of profile.
# Unstripped, `libkitty_lib.so` alone ran >1 GB (the daemon + adaptive-pathway
# + all bundled MCP servers, statically linked in for Android). `strip=symbols`
# applies the same shrink cargo's `[profile.release] strip = true` (below)
# already gives release builds, to debug builds too — a debug APK is for
# sideload-testing, not `gdb`/`lldb` symbol resolution, so there's nothing lost
# by dropping it there as well. Harmless to also apply on top of the release
# profile's own `strip = true` for android release builds — same effect, just
# asserted twice.
#
# Applied per-target so desktop builds are untouched.

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "strip=symbols"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "strip=symbols"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "strip=symbols"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "strip=symbols"]
