[package]
name = "kitty"
version = "0.10.1"
description = "Hotkey-summoned floating overlay chat client backed by BigTiny"
authors = ["Adam Zolkover"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Encodes clipboard image RGBA into PNG for the base64 data-URL sent to the
# frontend (Round-4 clipboard hotkey) — already pulled in transitively via
# arboard (clipboard-manager's backend), pinned here as a direct dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
# GGUF download verification (docs/ANDROID.md §5.2). Same pin the daemon uses.
sha2 = "0.10"
bytes = "1"
dirs = "5"
rand = "0.8"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.22"
semver = "1"
# The BigTiny V2 client crate -- discovery, app registration and SSE framing,
# shared with the other V2 frontends so they cannot drift apart. Needed on
# *both* targets: desktop uses `discovery::attach_or_spawn` to find a daemon
# it does not own, and Android, which hosts the daemon in-process, still uses
# `BigTinyClient::register` to obtain its app key over the loopback boundary.
# Deliberately NOT the daemon crate on desktop: a consumer speaking HTTP has
# no business linking sqlx, rmcp and LiteRT to do it.
bigtiny2-client = { path = "../BigTinyV2/client" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # Screenshot region capture (Feature 3): BitBlt/GetDIBits desktop-DC
    # capture — a small, well-understood API surface, so this stays a direct
    # Win32 call like the rest of this crate's usage rather than pulling in a
    # dedicated screen-capture crate (Kitty is Windows-only, so a
    # cross-platform crate's abstraction buys nothing here).
    "Win32_Graphics_Gdi",
] }
# Same version tauri-plugin-notification vendors transitively. Used directly
# (Round-3 item 27) because the plugin's own show() discards the toast
# activation handle, giving us no way to detect a notification click.
notify-rust = "4.18"
# HKCU\Environment + Run-key access (Ollama env helper, autostart-on-login).
# Windows-only by nature and does not compile for other targets at all, so it
# lives here rather than in [dependencies] — it was the first thing to break
# the Android build. See docs/ANDROID.md D23/§2.5.
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Desktop-only, and that is now enforced rather than assumed. keyring 3.x has
# apple-native / linux-native / windows-native backends and **nothing for
# Android**: on that target it silently falls through to its catch-all
# `pub use mock as default`, an in-memory HashMap. It compiled, it looked like
# it worked, and every provider API key vanished on relaunch (D24). Android's
# store is `src/android/secrets.rs` over the AndroidKeyStore; having the crate
# out of that target's graph entirely is what stops the mock coming back.
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-single-instance = "2"
# No OS-wide hotkey concept on mobile; the overlay-summon path this drives is
# desktop-only (docs/ANDROID.md D9/D23).
tauri-plugin-global-shortcut = "2"

# Android links the daemon in rather than spawning it (D8, §2.1/§2.3).
#
# Not a portability nicety — a requirement. Android 10+ refuses to `exec()`
# anything in an app-writable directory, which is why `externalBin` is empty
# in `tauri.android.conf.json` and why there is no daemon binary to spawn on
# this platform. Without this dependency the app has no backend at all: no
# chat, no MCP, no memory.
#
# This is **BigTinyV2**, the same daemon desktop talks to over HTTP. It used to
# be `plugins/bigtiny_rust` (V1), which left one product shipping two daemons
# with two schemas and two auth models — and left Android without specialists,
# the `KITTY_ALLOWED_DIRS` tool grants, and every other V2 fix. V1 stays in the
# tree, frozen, as the rollback path; nothing builds it.
#
# Desktop deliberately does NOT take this dependency. There the daemon stays a
# separate supervised process, which keeps a daemon crash survivable instead of
# taking the UI down with it, and lets other frontends share it. Linking it on
# both platforms would trade that away for nothing.
#
# `litert-embed`, not `litert-engine`: embeddings run in-process via LiteRT
# (EmbeddingGemma `.tflite` + the AAR `libLiteRt.so`), while
# compaction/summarization offloads to the remote chat model, so no generative
# model — and no native build — runs on the phone. `litert-embed` is pure
# `libloading` + pure-Rust `tokenizers`, which cross-compiles clean.
[target.'cfg(target_os = "android")'.dependencies]
bigtiny2_daemon = { path = "../BigTinyV2/daemon", features = ["litert-embed"] }
# Resolves the `content://` URI the save dialog returns into a writable file
# descriptor (`commands::download_file`). Rust-side only — see the plugin
# registration in `lib.rs` for why the webview gains nothing from this.
tauri-plugin-fs = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
