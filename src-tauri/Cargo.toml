[package]
name = "goose-overlay"
version = "0.1.0"
description = "Hotkey-summoned floating overlay chat client for the Goose agent"
authors = ["Adam Zolkover"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "goose_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
dirs = "5"
rand = "0.8"
tokio-tungstenite = "0.24"
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
# Same version tauri-plugin-notification vendors transitively. Used directly
# (Round-3 item 27) because the plugin's own show() discards the toast
# activation handle, giving us no way to detect a notification click.
notify-rust = "4.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
