[package]
name = "goose-overlay"
version = "0.1.0"
description = "Hotkey-summoned floating overlay chat client for the Goose agent"
authors = ["Adam Zolkover"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "goose_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Encodes clipboard image RGBA into PNG for the base64 data-URL sent to the
# frontend (Round-4 clipboard hotkey) — already pulled in transitively via
# arboard (clipboard-manager's backend), pinned here as a direct dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads/writes goose's own config.yaml (Round-7 Feature 4 — extension
# defaults, shared with Goose Desktop and any other local goose usage) and
# recipe .yaml import/export (Goose recipes feature). `serde_yaml` itself is
# deprecated/archived upstream; `serde_norway` is a direct, actively-released,
# API-identical continuation (same Value/Mapping/from_str/to_string surface).
serde_norway = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
dirs = "5"
rand = "0.8"
tokio-tungstenite = "0.24"
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
base64 = "0.22"
semver = "1"
# Extracts the Goose CLI zip archive during the wizard's one-click install
# (Goose publishes no Windows installer, only a plain zip — see wizard.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
# Same version tauri-plugin-notification vendors transitively. Used directly
# (Round-3 item 27) because the plugin's own show() discards the toast
# activation handle, giving us no way to detect a notification click.
notify-rust = "4.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
