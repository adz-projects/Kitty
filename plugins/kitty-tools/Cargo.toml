[package]
name = "kitty-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Word document tools (read/outline/write) — the Rust half of the lean_mcp.py split. See docs/PLUGINS.md."

# Standalone package, NOT a workspace member of src-tauri — see the plan's
# rationale (MSRV isolation: rmcp needs a newer edition/toolchain than
# src-tauri's pinned rust-version; [profile.*] is workspace-root-only and
# src-tauri's `panic = "abort"` must not leak here; feature unification would
# otherwise leak this crate's deps into the Tauri binary).

[lib]
name = "kitty_tools"
path = "src/lib.rs"

[[bin]]
name = "kitty-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
rmcp = { version = "=2.2.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
dirs = "5"
# Read-only Excel workbook access (`lean_excel_inspect`/`lean_excel_read_rows`),
# ported from `kitty-docs-web`'s openpyxl usage. Deliberately read-only: any
# spreadsheet *write* goes through the existing file tools as CSV (see the
# plan) rather than reintroducing an xlsx writer, keeping this small frozen
# binary lean. Broader than openpyxl in one respect: calamine also reads
# .xls/.ods, which openpyxl couldn't; the JSON envelope is unchanged.
calamine = { version = "0.26", features = ["dates"] }
# Pure-Rust PDF reading (`lean_pdf_read_text`/`lean_pdf_read_outline`), ported
# from `kitty-docs-web`'s PyMuPDF usage. Text layout differs from PyMuPDF's
# (lopdf does plain per-page text extraction, no markdown layout pass) — an
# accepted divergence documented in docs/VERSIONS.md, same as kitty-web's
# DDG-scrape/htmd substitutions.
lopdf = "0.34"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort" intentionally NOT set: rmcp/FastMCP-equivalent dispatch
# should return a structured error for a panicking tool call, not kill the
# whole server process and every subsequent call in the session.
