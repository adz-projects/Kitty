<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>__TITLE__</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 1rem;
            background-color: #fafafa;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #18181b;
            overflow-x: auto; /* Last-resort safety net: a diagram wider than the iframe scrolls instead of being crushed to illegibility (layouts normally fit MAX_CONTENT_W). */
            overflow-y: hidden; /* Height is driven by the auto-resize postMessage; never show a vertical scrollbar. */
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body data-content-w="__CONTENT_W__" data-content-h="__CONTENT_H__">
    __BODY__
    <script>
        // Height handshake with the host (see `ToolResultIframe` in
        // `src/components/chat/VisualizationCard.tsx`).
        //
        // Three traps this has to survive:
        //  1. Measure the *body*, never `documentElement`. Body's `overflow-y:
        //     hidden` propagates to the viewport, and the root element's
        //     scroll metrics then never report less than the viewport — i.e.
        //     less than the height the host already gave us. That ratchets:
        //     the card could grow but never shrink back when the content gets
        //     shorter (a narrower window scales the width-driven SVG down).
        //  2. `ResizeObserver` fires its first callback before the SVG has
        //     laid out, so the first measurement is a placeholder. A
        //     measurement is never final: re-send after load and again as the
        //     layout settles, and answer the host whenever it asks.
        //  3. An inline `<svg viewBox width=100%>` does NOT reliably resolve
        //     its intrinsic height in every WebView — under `height:auto` it
        //     can collapse to a near-zero box, so the body measures far too
        //     short and the card is a sliver (the reported "too short" bug).
        //     For SVG payloads the renderer bakes the exact canvas dimensions
        //     into `data-content-w/h`; we set the SVG's pixel height from them
        //     (rendered width × intrinsic ratio) so its size is deterministic
        //     and independent of the WebView's intrinsic-ratio handling. HTML
        //     tables carry no dimensions and fall back to pure measurement.
        (function () {
            var last = -1;
            var cw = parseFloat(document.body.getAttribute('data-content-w') || '');
            var ch = parseFloat(document.body.getAttribute('data-content-h') || '');
            function applySvgHeight() {
                if (!(cw > 0 && ch > 0)) return;
                var svg = document.body.querySelector('svg');
                if (!svg) return;
                var cs = getComputedStyle(document.body);
                var contentW = document.body.clientWidth
                    - parseFloat(cs.paddingLeft || '0')
                    - parseFloat(cs.paddingRight || '0');
                if (contentW > 0) {
                    svg.style.height = (contentW * (ch / cw)) + 'px';
                }
            }
            function measure() {
                applySvgHeight();
                var b = document.body;
                return Math.max(
                    b.scrollHeight,
                    b.offsetHeight,
                    Math.ceil(b.getBoundingClientRect().height)
                );
            }
            function sendHeight(force) {
                var h = measure();
                // A zero/negative measurement means layout hasn't happened
                // yet; a later re-measure will carry the real value.
                if (h <= 0) return;
                if (!force && h === last) return;
                last = h;
                window.parent.postMessage({ type: 'mcp-iframe-resize', height: h }, '*');
            }
            document.addEventListener('DOMContentLoaded', function () { sendHeight(); });
            window.addEventListener('load', function () {
                sendHeight();
                requestAnimationFrame(function () { sendHeight(); });
                // Fonts and late layout can still change the height after
                // `load`; a few cheap re-measures cost nothing and stop the
                // card settling on a too-short height.
                [100, 300, 800].forEach(function (ms) { setTimeout(function () { sendHeight(); }, ms); });
            });
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(function () { sendHeight(); }).observe(document.body);
            }
            // The host asks again after its own load event and whenever the
            // iframe's width changes (the SVG is width-driven, so its height
            // changes with it). `force` because the host may have missed the
            // last message it is asking us to repeat.
            window.addEventListener('message', function (e) {
                var d = e.data;
                if (d && d.type === 'mcp-iframe-measure') sendHeight(true);
            });
        })();
    </script>
</body>
</html>
