[package]
name = "bigtiny_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bigtiny_rust"
path = "src/lib.rs"

# Test-only helper: a minimal stdio MCP server used by tests/mcp_never_throws.rs.
[[bin]]
name = "fake_mcp_server"
path = "tests/bin/fake_mcp_server.rs"

# The real daemon binary. Named to match what Kitty's process lifecycle
# (`src-tauri/src/lifecycle/bigtiny_proc.rs`) already spawns and pidfile-checks
# by process-name fragment ("bigtiny-daemon").
[[bin]]
name = "bigtiny-daemon"
path = "src/bin/bigtiny_daemon.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tiktoken-rs = "0.6"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
futures = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
regex = "1"
bytes = "1"
async-trait = "0.1"
sha2 = "0.10"
ipnet = "2"
dashmap = "6"
once_cell = "1"
rmcp = { version = "0.9", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
jsonschema = "0.26"
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
tokio-cron-scheduler = "0.13"
minijinja = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aes-gcm = "0.10"
rand = "0.8"

[dev-dependencies]
mockito = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
