[package]
name = "bigtiny_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bigtiny_rust"
path = "src/lib.rs"

# Test-only helper: a minimal stdio MCP server used by tests/mcp_never_throws.rs.
[[bin]]
name = "fake_mcp_server"
path = "tests/bin/fake_mcp_server.rs"

# The real daemon binary. Named to match what Kitty's process lifecycle
# (`src-tauri/src/lifecycle/bigtiny_proc.rs`) already spawns and pidfile-checks
# by process-name fragment ("bigtiny-daemon").
[[bin]]
name = "bigtiny-daemon"
path = "src/bin/bigtiny_daemon.rs"

# Phase 1 linkage probe. `required-features` keeps `cargo build/clippy
# --all-targets` working without the (expensive, cmake-driven) local-engine
# feature — without it, the default all-targets sweep would try to compile
# this example and fail on the missing `llama_cpp_2` crate.
[[example]]
name = "local_engine_spike"
required-features = ["local-engine"]

[[example]]
name = "local_embed_spike"
required-features = ["local-engine"]

[[example]]
name = "backend_probe"
required-features = ["local-engine"]

[features]
# In-process llama.cpp engine (docs/ANDROID.md D1, §3). Opt-in because
# `llama-cpp-sys-2` builds llama.cpp from source via cmake — a multi-minute
# first build that ordinary daemon work shouldn't pay for.
local-engine = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
# llama.cpp bindings. `default-features = false` is load-bearing: the crate's
# default set is ["openmp", "android-shared-stdcxx", "common"], and BOTH of the
# first two are wrong for us — docs/ANDROID.md §11 requires OpenMP off on
# Android (libgomp is a missing-symbol hazard on varied OEM devices) and a
# STATIC libc++ so the APK ships one self-contained cdylib with nothing to
# dlopen. Per-target feature sets below.
#
# Note this supersedes D1's `llama_cpp` placeholder: that crate was last
# released 2024-04-29 and is abandoned. `llama-cpp-2` (utilityai/llama-cpp-rs)
# is actively released and carries first-class Android features.
llama-cpp-2 = { version = "0.1.154", default-features = false, features = [
    "common",
], optional = true }
# `token_to_piece` takes an `encoding_rs::Decoder` so a multi-byte codepoint
# split across two tokens still renders correctly during streaming.
encoding_rs = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
# `time` enables `TimeoutStream`, used to implement the per-provider SSE
# idle-read timeout (see `provider::openai_compat`/`anthropic`).
tokio-stream = { version = "0.1", features = ["time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tiktoken-rs = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
futures = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
regex = "1"
bytes = "1"
async-trait = "0.1"
sha2 = "0.10"
ipnet = "2"
dashmap = "6"
once_cell = "1"
rmcp = { version = "0.9", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
jsonschema = "0.26"
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
tokio-cron-scheduler = "0.13"
minijinja = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aes-gcm = "0.10"
rand = "0.8"
# Only used for the in-process MCP transport (`mcp::client::connect_in_process`
# via `mcp::builtin`), i.e. an exec()-restricted host that can't spawn
# `kitty-tools`' stdio binary as a child process (see that module's doc
# comment). This crate pins a *different* rmcp major version
# (`kitty-tools` = 2.2.0, this crate = 0.9) — both resolve independently,
# which is fine, since the two only ever exchange serialized JSON-RPC bytes
# on the in-process pipe, never Rust types across the version boundary.
#
# Known tradeoff, accepted rather than engineered around: `kitty-tools`'
# `[profile.release]` (opt-level="z", fat LTO — tuned for its life as a
# small frozen exe) only takes effect when it's the crate cargo is building
# at the workspace root. As a path dependency of this crate it inherits
# whatever profile *this* build uses instead, same as any other dependency.
# Not worth hoisting both crates into a shared Cargo workspace to fix — that
# would reverse `kitty-tools/Cargo.toml`'s explicit "deliberately not a
# workspace member" stance (MSRV isolation, `panic = "abort"` not leaking
# from `src-tauri`), and the size/speed difference is unlikely to matter
# once this is linked into a full app binary rather than shipped standalone.
kitty-tools = { path = "../kitty-tools" }
kitty-web = { path = "../kitty-web" }
kitty-wasm = { path = "../kitty-wasm" }
# Behavioral memory engine, linked in-process (see docs/adaptive-pathway-v2.md).
# Path dep so its crate is built with this crate's profile; it must stay
# sqlx = "0.8" to keep a single libsqlite3-sys across this workspace.
adaptive-pathway = { path = "../adaptive-pathway_rust" }

# Android: static libc++ so the APK ships a single self-contained cdylib with
# no helper `.so` to dlopen (docs/ANDROID.md §11, D22). OpenMP stays OFF — it
# is deliberately absent from this feature list, not merely unlisted.
#
# **Vulkan on (ADDENDUM 3).** Without a GPU backend the support models
# (summarizer + embedder) ran on all CPU cores, which cooked the phone and
# starved the WebView. Vulkan is a system library on Android API 24+
# (`libvulkan.so`), and `llama-cpp-sys-2` compiles the compute shaders to
# SPIR-V at build time with host `glslc` (from the Vulkan SDK, same tool the
# Windows build already needs) — so this only adds a *build-host* prerequisite,
# not a device one. It only widens what the ggml device registry enumerates;
# `local::backend::select_backend` still decides, and a device whose Vulkan
# driver can't run the shaders falls back to CPU (now thread-capped, see
# `local/engine.rs`). If the arm64 build can't find `glslc`, it dies in the
# cmake step like the Ninja/libclang traps in docs/ANDROID.md §11.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = [
    "common",
    "android-static-stdcxx",
    "static-stdcxx",
    "vulkan",
], optional = true }

# Windows: **Vulkan on** (D20). Chosen over CUDA because it covers NVIDIA, AMD
# and Intel from one build — including the integrated GPUs that are the only
# accelerator on most laptops — where CUDA would cover one vendor and add a
# ~3 GB toolkit to the build prerequisites. `cuda` stays available as a feature
# for anyone who wants it; `local::backend` already ranks it above Vulkan, so
# turning it on needs no code change.
#
# **Requires the Vulkan SDK** — `llama-cpp-sys-2` shells out to `glslc` to
# compile the shaders, and without it the build dies inside the cmake step with
# a message that reads like a crate bug rather than a missing tool, exactly like
# the libclang and Ninja prerequisites in docs/ANDROID.md §11.
# `winget install KhronosGroup.VulkanSDK` is the clean fix.
#
# Enabling this only widens what the ggml device registry *enumerates*; which
# device a load actually uses is still `local::backend::select_backend`'s
# decision, and a machine with no Vulkan-capable GPU keeps getting CPU.
[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = [
    "common",
    "vulkan",
], optional = true }

[dev-dependencies]
mockito = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
