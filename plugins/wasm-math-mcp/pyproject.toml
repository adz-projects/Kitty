[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasm-math-mcp"
version = "0.1.0"
description = "Sandboxed Python execution (math/stats/graphs via NetworkX) as a stdio MCP tool."
requires-python = ">=3.11"
dependencies = [
    # Capped below 2.0: `wasm_math_mcp.py` imports `mcp.server.fastmcp.FastMCP`,
    # a submodule the SDK's 2.0 release removed/restructured entirely (same
    # regression fixed for adaptive-pathway-mcp — confirmed via a live probe:
    # mcp==2.0.0 has no `fastmcp` under `mcp.server` at all). An unpinned
    # `>=1.2.0` silently pulls 2.0+ and produces a frozen exe that fails
    # every stdio connect with "ModuleNotFoundError: No module named
    # 'mcp.server.fastmcp'".
    "mcp[cli]>=1.2.0,<2.0.0",
    "networkx>=3.0",
]

[project.scripts]
wasm-math-mcp = "wasm_math_mcp:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
py-modules = ["wasm_math_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
