[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replacement-mcp"
version = "0.1.0"
description = "Lean, context-optimized MCP tools replacing Goose's built-in developer + computer_controller extensions for local small models."
requires-python = ">=3.11"
# Word/PDF/Excel/web-scrape/DDG-search moved out to kitty-tools (Rust) and
# kitty-docs-web (Python) respectively — see lean_mcp.py's top-of-file note.
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
replacement-mcp = "lean_mcp:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
py-modules = ["lean_mcp"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["tool_prompts.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
