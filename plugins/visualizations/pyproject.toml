[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualizations"
version = "0.1.0"
description = "Accessible HTML tables and SVG diagrams, wrapped for iframe rendering, as a stdio MCP tool."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
visualizations = "visualizations:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
py-modules = ["visualizations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
