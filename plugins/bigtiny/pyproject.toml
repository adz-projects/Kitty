[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigtiny"
version = "0.1.0"
description = "Chat-first REST/SSE agent daemon."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "starlette>=0.36",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.0",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "tiktoken>=0.7",
    "structlog>=24.1",
    "keyring>=24.0",
]

[project.scripts]
bigtiny-daemon = "bigtiny.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bigtiny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
