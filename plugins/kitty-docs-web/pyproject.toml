[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-docs-web"
version = "0.1.0"
description = "PDF/Excel reading, web scraping, and web search (Brave-preferred, DuckDuckGo fallback) — the half of replacement-mcp's tool set that needs Python's document/web libraries (PyMuPDF, trafilatura, ddgs, openpyxl)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "ddgs>=9.0",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
]

[project.scripts]
kitty-docs-web = "kitty_docs_web:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["kitty_docs_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["build", "dist", ".build-venv"]

[tool.ruff.lint]
# pycodestyle errors + pyflakes + import sorting only — kept deliberately
# unaggressive, matching kitty-tools' equivalent gate (cargo clippy) running
# clean at its default lint level rather than a strict profile. Spelled out
# explicitly rather than relying on ruff's implicit default selection, which
# (at least as of ruff 0.16) pulls in a much broader rule set than the
# documented E4/E7/E9/F default once any `[tool.ruff]` config is present.
select = ["E", "F", "I"]
