[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-docs-web"
version = "0.1.0"
description = "PDF/Excel reading, web scraping, and web search (Brave-preferred, DuckDuckGo fallback) — the half of replacement-mcp's tool set that needs Python's document/web libraries (PyMuPDF, trafilatura, ddgs, openpyxl)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "ddgs>=9.0",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
]

[project.scripts]
kitty-docs-web = "kitty_docs_web:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools]
py-modules = ["kitty_docs_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
