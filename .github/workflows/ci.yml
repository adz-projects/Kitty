# Kitty's CI. Four jobs, each guarding a different way a release has broken
# before:
#
# - frontend: lint (eslint + prettier), vitest, and the version lockstep check.
# - rust:     clippy -D warnings and `cargo test` for every crate Kitty ships,
#             one matrix leg per crate (they are separate Cargo workspaces).
# - bundle:   a real `tauri build` of the Windows installer, and a real
#             `tauri android build` of the AAB. A type-check alone missed the
#             Android lane rotting for two releases (see git history of the
#             android.yml this replaces).
# - binaries: the committed daemon/plugin binaries match the source that
#             ships them, and none of them is a git-lfs pointer.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (lint, vitest, versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: python3 scripts/check_versions.py

  rust:
    name: rust (${{ matrix.crate }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - src-tauri
          - BigTinyV2/protocol
          - BigTinyV2/client
          - BigTinyV2/daemon
          - plugins/kitty-tools
          - plugins/kitty-web
          - plugins/kitty-wasm
          - plugins/adaptive-pathway_rust
          - plugins/memorabilia_rust
    steps:
      - uses: actions/checkout@v4

      # `src-tauri` needs the bundled binaries and resources present:
      # tauri-build refuses to compile when an externalBin or resource path is
      # missing. They are LFS objects, cached so repeated runs don't spend the
      # repository's LFS bandwidth quota.
      - name: Fetch LFS objects (src-tauri only)
        if: matrix.crate == 'src-tauri'
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        if: matrix.crate == 'src-tauri'
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - if: matrix.crate == 'src-tauri'
        run: git lfs pull

      # tauri-build also needs the frontend build output it bundles.
      - uses: pnpm/action-setup@v4
        if: matrix.crate == 'src-tauri'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        if: matrix.crate == 'src-tauri'
        with:
          node-version: '22'
          cache: pnpm
      - if: matrix.crate == 'src-tauri'
        run: pnpm install --frozen-lockfile
      - if: matrix.crate == 'src-tauri'
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked

  windows-bundle:
    name: bundle (Windows NSIS)
    needs: [frontend, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kitty-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-bundle:
    name: bundle (Android AAB, unsigned)
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # Pinned to match docs/ANDROID.md D22: a different NDK is a
          # different libc++ and sysroot.
          ndk-version: r27c
          local-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 only: `edgefirst-tflite-sys` does not compile 32-bit, and
          # arm64-v8a is the only ABI shipped.
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No keystore.properties in CI, so the release variant is unsigned by
      # design (see gen/android/app/build.gradle.kts): this verifies the lane
      # builds, and Play would reject the artifact, which is what we want.
      - name: tauri android build
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: pnpm tauri android build --aab --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: kitty-android-aab-unsigned
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  binaries:
    name: bundled binaries match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - run: python3 plugins/build.py --verify-manifest
